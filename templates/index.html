<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON to CSV</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 1.5rem;
    }
    main {
      width: min(100%, 34rem);
      padding: 2rem;
      border: 1px solid #dce2ec;
      border-radius: 1rem;
      background: white;
      box-shadow: 0 1rem 3rem rgba(29, 45, 75, 0.08);
    }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    p { color: #5b6578; line-height: 1.6; }
    label { display: block; margin: 1.5rem 0 0.5rem; font-weight: 700; }
    input, button { width: 100%; padding: 0.85rem 1rem; border-radius: 0.5rem; font: inherit; }
    input { border: 1px solid #aeb8c8; }
    input:focus { border-color: #315ee7; outline: 3px solid #dce5ff; }
    button {
      margin-top: 1rem;
      border: 0;
      background: #315ee7;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: #244bc1; }
    input:disabled, button:disabled { cursor: not-allowed; opacity: 0.65; }
    .button-content { display: inline-flex; align-items: center; gap: 0.6rem; }
    .spinner {
      display: none;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    form[aria-busy="true"] .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.5s; }
    }
    .error { padding: 0.8rem; border-left: 4px solid #c53232; background: #fff0f0; color: #8e2020; }
  </style>
</head>
<body>
  <main>
    <h1>JSON to CSV</h1>
    <p>Enter an API parameter and download the returned JSON as a CSV file.</p>
    <p class="error" id="error" role="alert" {{if not .Error}}hidden{{end}}>{{.Error}}</p>
    <form method="post" action="/export">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label for="parameter">API parameter</label>
      <input id="parameter" name="parameter" type="text" maxlength="200" required
             autocomplete="off" placeholder="e.g. example">
      <button type="submit">
        <span class="button-content">
          <span class="spinner" aria-hidden="true"></span>
          <span id="button-label">Generate and download CSV</span>
        </span>
      </button>
    </form>
  </main>
  <script>
    const form = document.querySelector("form");
    const parameter = document.querySelector("#parameter");
    const button = form.querySelector("button");
    const buttonLabel = document.querySelector("#button-label");
    const errorMessage = document.querySelector("#error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const body = new URLSearchParams();
      body.set("parameter", parameter.value);
      body.set("csrf_token", form.elements.csrf_token.value);
      form.setAttribute("aria-busy", "true");
      parameter.disabled = true;
      button.disabled = true;
      buttonLabel.textContent = "Preparing your CSV...";
      errorMessage.hidden = true;

      try {
        const response = await fetch(form.action, { method: "POST", body });
        if (!response.ok) {
          const page = await response.text();
          const parsedPage = new DOMParser().parseFromString(page, "text/html");
          throw new Error(
            parsedPage.querySelector(".error")?.textContent?.trim() ||
              "Unable to generate the CSV."
          );
        }

        const blob = await response.blob();
        const disposition = response.headers.get("Content-Disposition") || "";
        const filename = disposition.match(/filename="([^"]+)"/)?.[1] || "export.csv";
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = filename;
        link.click();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 0);
        form.reset();
      } catch (error) {
        errorMessage.textContent = error.message || "Unable to generate the CSV.";
        errorMessage.hidden = false;
      } finally {
        form.removeAttribute("aria-busy");
        parameter.disabled = false;
        button.disabled = false;
        buttonLabel.textContent = "Generate and download CSV";
        parameter.focus();
      }
    });
  </script>
</body>
</html>
